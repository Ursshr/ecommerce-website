<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HandSkill Boutique | Collection</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #fffaf5; }
        .product-card:hover img { transform: scale(1.05); }
        .search-bar:focus { outline: none; border-color: #d4a373; box-shadow: 0 0 0 3px rgba(212, 163, 115, 0.2); }
    </style>
</head>
<body>

    <nav class="bg-white shadow-sm sticky top-0 z-50 px-6 py-4 flex flex-col md:flex-row items-center justify-between gap-4">
        <div class="text-3xl font-bold text-gray-800" style="font-family: 'Playfair Display';">HandSkill<span class="text-amber-600">.</span></div>
        
        <div class="relative w-full md:w-1/3">
            <input type="text" id="searchInput" placeholder="Search for sketches, hampers, boards..." 
                   class="search-bar w-full px-4 py-2 rounded-full border border-gray-200 pl-10 transition-all">
            <i class="fas fa-search absolute left-4 top-3 text-gray-400"></i>
        </div>

        <ul class="flex gap-6 text-sm font-medium text-gray-600">
            <li><a href="index.html" class="hover:text-amber-600">Home</a></li>
            <li><a href="products.html" class="text-amber-600">Collection</a></li>
            <li><a href="cart.html"><i class="fas fa-shopping-basket text-lg"></i></a></li>
        </ul>
    </nav>

    <header class="text-center py-12 px-4">
        <h1 class="text-4xl md:text-5xl font-bold mb-4" style="font-family: 'Playfair Display';">Our Handcrafted Treasures</h1>
        <p class="text-gray-500 max-w-xl mx-auto">Discover unique, handmade items created with passion and perfection.</p>
    </header>

    <div class="max-w-7xl mx-auto px-6 pb-20">
        <div id="product-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-8">
            <!-- Products will be dynamically loaded here -->
        </div>
        <div id="no-results" class="hidden text-center py-20 text-gray-500">
            <i class="fas fa-search-minus text-5xl mb-4"></i>
            <p>No products found matching your search.</p>
        </div>
    </div>

    <script>
        const products = [
            { id: 0, name: "Customise Sketch", price: 1000, tag: "Popular", img: "images/sketch.jpeg", category: "art" },
            { id: 1, name: "Hamper Box", price: 800, tag: "Trending", img: "images/hamper.jpeg", category: "hampers" },
            { id: 2, name: "Photo Frame", price: 600, tag: "Customised", img: "images/photoframe.jpeg", category: "gift" },
            { id: 3, name: "Customise board", price: 2100, tag: "Handmade", img: "images/board.jpeg", category: "decor" },
            { id: 4, name: "Handmade cards", price: 300, tag: "Custom", img: "images/card.jpeg", category: "cards" }
        ];

        function renderProducts(filterText = '') {
            const grid = document.getElementById('product-grid');
            const noResults = document.getElementById('no-results');
            
            const filtered = products.filter(p => 
                p.name.toLowerCase().includes(filterText.toLowerCase()) || 
                p.category.toLowerCase().includes(filterText.toLowerCase())
            );

            if (filtered.length === 0) {
                grid.classList.add('hidden');
                noResults.classList.remove('hidden');
            } else {
                grid.classList.remove('hidden');
                noResults.classList.add('hidden');
                
                grid.innerHTML = filtered.map(p => `
                    <div class="product-card bg-white rounded-2xl overflow-hidden shadow-sm hover:shadow-xl transition-all cursor-pointer border border-gray-100" 
                         onclick="window.location.href='product-view.html?id=${p.id}'">
                        <div class="relative h-64 overflow-hidden">
                            <span class="absolute top-3 left-3 bg-white/90 px-3 py-1 rounded-full text-xs font-bold text-amber-700 z-10">${p.tag}</span>
                            <img src="${p.img}" alt="${p.name}" class="w-full h-full object-cover transition-transform duration-500" 
                                 onerror="this.src='https://placehold.co/400x400?text=HandSkill+Product'">
                        </div>
                        <div class="p-5">
                            <h4 class="text-lg font-semibold text-gray-800 mb-1">${p.name}</h4>
                            <p class="text-amber-600 font-bold text-xl mb-4">₹${p.price}</p>
                            <button class="w-full bg-gray-900 text-white py-3 rounded-xl hover:bg-amber-600 transition-colors font-medium">View Details</button>
                        </div>
                    </div>
                `).join('');
            }
        }

        document.getElementById('searchInput').addEventListener('input', (e) => {
            renderProducts(e.target.value);
        });

        // Initial render
        window.onload = () => renderProducts();
    </script>
</body>
</html>
