<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Basket | HandSkill</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #fffaf5; }
        .cart-card { transition: all 0.3s ease; }
        .cart-card:hover { transform: translateY(-2px); }
        .playfair { font-family: 'Playfair Display', serif; }
    </style>
</head>
<body class="pb-20">

    <nav class="bg-white shadow-sm sticky top-0 z-50 px-6 py-4 flex items-center justify-between">
        <div class="text-2xl font-bold cursor-pointer playfair" onclick="window.location.href='index.html'">
            HandSkill<span class="text-amber-600">.</span>
        </div>
        <div class="flex gap-4">
            <a href="products.html" class="text-sm font-medium text-gray-600 hover:text-amber-600">
                <i class="fas fa-store mr-1"></i> Shop
            </a>
        </div>
    </nav>

    <main class="max-w-3xl mx-auto px-4 py-10">
        <h1 class="text-3xl font-bold text-gray-900 mb-8 playfair">Your Basket</h1>

        <div id="cart-container" class="hidden space-y-6">
            <div id="cart-items" class="space-y-4">
                <!-- Items injected here via JS -->
            </div>

            <div class="bg-white p-8 rounded-[30px] shadow-sm border border-orange-100 mt-10">
                <div class="flex justify-between items-center mb-6">
                    <span class="text-gray-500 font-medium">Subtotal</span>
                    <span id="total-price" class="text-3xl font-bold text-gray-900">₹0</span>
                </div>
                <div class="flex flex-col sm:flex-row gap-4">
                    <button onclick="clearFullCart()" class="flex-1 border border-gray-200 py-4 rounded-2xl text-gray-500 hover:bg-gray-50 transition-all font-medium">
                        Clear Basket
                    </button>
                    <button onclick="window.location.href='checkout.html'" class="flex-[2] bg-black text-white py-4 rounded-2xl font-bold text-lg hover:bg-gray-800 transition-all shadow-xl shadow-gray-200 flex items-center justify-center gap-2">
                        Proceed to Delivery <i class="fas fa-arrow-right"></i>
                    </button>
                </div>
            </div>
        </div>

        <div id="empty-state" class="text-center py-20 bg-white rounded-[40px] border border-dashed border-gray-200">
            <div class="text-7xl mb-6">🧺</div>
            <h2 class="text-2xl font-bold text-gray-800 mb-2 playfair">Your basket is lonely</h2>
            <p class="text-gray-500 mb-8 px-6">Looks like you haven't added any handcrafted treasures yet.</p>
            <a href="products.html" class="bg-amber-600 text-white px-10 py-4 rounded-full font-bold hover:bg-amber-700 transition-all inline-block shadow-lg shadow-amber-100">
                Start Shopping
            </a>
        </div>
    </main>

    <script>
        function loadCart() {
            const cartItems = JSON.parse(localStorage.getItem('handskill_cart')) || [];
            const container = document.getElementById('cart-container');
            const emptyState = document.getElementById('empty-state');
            const list = document.getElementById('cart-items');
            
            if (cartItems.length === 0) {
                container.classList.add('hidden');
                emptyState.classList.remove('hidden');
                return;
            }

            emptyState.classList.add('hidden');
            container.classList.remove('hidden');

            let total = 0;
            list.innerHTML = cartItems.map((item, index) => {
                // Securely parsing the price
                let price = String(item.price).replace(/[₹,]/g, '');
                let priceNum = parseInt(price) || 0;
                total += priceNum;

                return `
                    <div class="cart-card flex items-center justify-between bg-white p-4 rounded-2xl border border-gray-100 shadow-sm">
                        <div class="flex items-center gap-4">
                            <div class="w-20 h-20 rounded-xl overflow-hidden bg-gray-50 border border-gray-100">
                                <img src="${item.img || 'https://placehold.co/100x100?text=Gift'}" 
                                     class="w-full h-full object-cover" 
                                     onerror="this.src='https://placehold.co/100x100?text=HandSkill'">
                            </div>
                            <div>
                                <h4 class="font-bold text-gray-900">${item.name}</h4>
                                <p class="text-amber-600 font-bold">₹${priceNum}</p>
                            </div>
                        </div>
                        <button onclick="removeItem(${index})" class="text-gray-300 hover:text-red-500 p-4 transition-colors">
                            <i class="fas fa-trash-alt text-lg"></i>
                        </button>
                    </div>
                `;
            }).join('');

            document.getElementById('total-price').innerText = "₹" + total;
        }

        function removeItem(index) {
            let cartItems = JSON.parse(localStorage.getItem('handskill_cart')) || [];
            cartItems.splice(index, 1);
            localStorage.setItem('handskill_cart', JSON.stringify(cartItems));
            loadCart();
        }

        function clearFullCart() {
            // Using a simple check instead of confirm for smoother UI
            localStorage.removeItem('handskill_cart');
            loadCart();
        }

        // Initialize cart on load
        window.onload = loadCart;
    </script>
</body>
</html>
